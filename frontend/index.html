<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pluto Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  font-family: sans-serif;
  
  background: radial-gradient(circle at 20% 30%, rgba(88, 28, 135, 0.4), transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(30, 64, 175, 0.4), transparent 40%),
              linear-gradient(135deg, #020617, #0f172a, #1e1b4b);

  color: white;
  overflow-x: hidden;
}
/* ===== SPACE BACKGROUND ===== */

.space-bg{
position:fixed;
inset:0;

background:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),

radial-gradient(circle at 20% 30%, rgba(56,189,248,0.15), transparent),
radial-gradient(circle at 80% 70%, rgba(168,85,247,0.2), transparent),
radial-gradient(circle at 50% 80%, rgba(244,63,94,0.1), transparent),

#020617;

background-size: 40px 40px, 40px 40px, cover, cover, cover, cover;

z-index:-2;
}

.stars{
position:fixed;
inset:0;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.25;
animation: moveStars 60s linear infinite;
z-index:-1;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}
/* layout */

.workspace{
display:grid;
grid-template-columns:160px 460px 1fr;
min-height:100vh;   /* 🔥 shumë e rëndësishme */
}
/* viewer shkon poshtë panel */
.viewer{
order:3;
height:280px;
}

/* panel në mes */
.panel{
order:2;
}

/* sidebar sipër */
.sidebar{
order:1;
}
/* sidebar */

.sidebar{
padding-top:35px;
gap:25px;
background: rgba(15, 23, 42, 0.6);
backdrop-filter:blur(10px);
border-right:1px solid rgba(56,189,248,0.2);

display:flex;
flex-direction:column;
align-items:center;

padding-top:25px;
gap:20px;

}

.logo{

font-family:Orbitron;
color:#38bdf8;
margin-bottom:20px;

}
.logo-container{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.logo-orb{
width:70px;
height:70px;

border-radius:50%;

background:
radial-gradient(circle, #fff, #38bdf8, #000);

box-shadow:
0 0 20px #38bdf8,
0 0 40px #38bdf8;

animation:pulseOrb 3s infinite;
}

@keyframes pulseOrb{
0%,100%{transform:scale(1);}
50%{transform:scale(1.1);}
}
.sidebtn{

width:80px;
height:70px;

border-radius:15px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:rgba(14,165,233,0.1);
border:1px solid rgba(56,189,248,0.4);

transition:0.2s;

}

.sidebtn:hover{

background:#0ea5e9;

}

/* panel */

.panel{
padding:30px;
overflow:auto;   /* duhet scroll */
background: rgba(15, 23, 42, 0.6);
backdrop-filter:blur(12px);
border-right:1px solid rgba(56,189,248,0.2);
scroll-behavior:smooth;
/* 🔥 HIDE SCROLLBAR */
scrollbar-width: none;        /* Firefox */
-ms-overflow-style: none;     /* IE/Edge */
}
.panel::-webkit-scrollbar{
display:none;   /* Chrome, Safari */
}


/* viewer */

.viewer{
position:relative;
background:
radial-gradient(circle at center, rgba(59,130,246,0.12), transparent 70%),
radial-gradient(circle at 30% 20%, rgba(168,85,247,0.15), transparent 40%),
radial-gradient(circle at 70% 80%, rgba(56,189,248,0.15), transparent 40%);

background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

background-size: 60px 60px;
border: 1px solid rgba(99, 102, 241, 0.2);
backdrop-filter: blur(6px);

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;



}
.viewer::before{
content:"";
position:absolute;
inset:0;

background:url("https://www.transparenttextures.com/patterns/circuit-board.png");

opacity:0.12;
mix-blend-mode:screen;

animation: neuralMove 40s linear infinite;

pointer-events:none;
z-index:0;
}
.viewer::after{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(circle at center, rgba(168,85,247,0.2), transparent 70%);

animation: neuralPulse 6s ease-in-out infinite;

pointer-events:none;
z-index:1;
}
.viewer-title{

position:absolute;
top:20px;
left:20px;

font-family:Orbitron;
color:#38bdf8;
text-shadow: 0 0 10px rgba(56,189,248,0.5);
}

#viewer{

width:100%;
height:100%;

box-shadow:
0 0 60px rgba(14,165,233,0.4);

}

/* panels */

.toolpanel{

display:block;

}

.hidden{

display:none;

}

/* title */

.section-title{

font-family:Orbitron;
font-size:22px;
color:#38bdf8;
margin-bottom:20px;

}

/* upload */

.dropzone{
border-radius:14px;
padding:35px;
text-align:center;
margin-bottom:15px;

background:rgba(255,255,255,0.03);
backdrop-filter:blur(8px);
border:1px solid rgba(56,189,248,0.3);
}

/* buttons */

button{
width:100%;
padding:12px;
margin-top:10px;

border-radius:12px;
cursor:pointer;

background:rgba(56,189,248,0.1);
border:1px solid rgba(56,189,248,0.4);

backdrop-filter:blur(10px);

color:white;

transition:0.25s;
}

button:hover{
background:rgba(56,189,248,0.3);
box-shadow:0 0 15px rgba(56,189,248,0.5);
}

.btn-premium{
background:rgba(251,146,60,0.15);
border:1px solid rgba(251,146,60,0.6);
}

.btn-premium:hover{
box-shadow:0 0 15px rgba(251,146,60,0.7);
}

/* preview */

.preview{

display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;

}

.preview img{

width:80px;
border-radius:8px;
border:2px solid #0ea5e9;

}

/* progress */

.progress{

height:6px;
background:#020617;
border-radius:10px;
overflow:hidden;
margin-top:15px;

}

.progress-bar{

height:100%;
width:0%;

background:
linear-gradient(90deg,#38bdf8,#0ea5e9);

}

/* status */

.status{

margin-top:10px;
font-size:13px;
color:#7dd3fc;

}
/* ===== AI CORE ===== */

.ai-core{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle, #fff, #38bdf8, #a855f7, #000);

box-shadow:
0 0 40px #38bdf8,
0 0 80px #38bdf8;

animation:pulse 3s ease-in-out infinite;

pointer-events:none;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
box-shadow:0 0 40px #38bdf8;
}
50%{
transform:scale(1.1);
box-shadow:0 0 80px #38bdf8;
}
}
.logo-orb{
transition:transform 0.15s ease;
}
.logo-orb-container{
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.orb-greeting{
position:absolute;
top:60px;
background:rgba(15,23,42,0.9);
padding:6px 12px;
border-radius:10px;
font-size:13px;
color:#38bdf8;

opacity:0;
transform:translateY(10px);
transition:0.3s;

pointer-events:none;
white-space:nowrap;

box-shadow:0 0 10px rgba(56,189,248,0.4);
}

.orb-greeting.show{
opacity:1;
transform:translateY(0);
}

.logo-orb.active{
box-shadow:
0 0 30px #38bdf8,
0 0 60px #38bdf8,
0 0 90px #a855f7;
}

.logo-orb.shake{
animation:shake 0.4s ease;
}

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(1px,-1px);}
50%{transform:translate(-1px,1px);}
75%{transform:translate(1px,1px);}
100%{transform:translate(0,0);}
}

/* ===== MOBILE FINAL (Pluto PRO) ===== */

@media (max-width: 900px){
/* 🔥 FIX VIEWER SHFAQJE */
.viewer{
display:block !important;
order:3;

width:100% !important;
height:260px !important;

min-height:200px;
flex-shrink:0;

position:relative;
z-index:1;
}

/* panel sipër */
.panel{
order:2;
}

/* sidebar sipër fare */
.sidebar{
order:1;
}

/* workspace duhet të lejojë rritje */
.workspace{
overflow:visible !important;
}
.workspace{
display:flex !important;
flex-direction:column !important;
grid-template-columns:none !important;   /* 🔥 KJO E VRIT GRID */
}

/* gjithashtu sigurohu */
.sidebar, .panel, .viewer{
width:100% !important;
}
.sidebar{
position:relative;   /* 🔥 mos jetë fixed */
flex-direction:row;
justify-content:space-around;
align-items:center;

width:100%;
height:auto;
padding:10px;

background:rgba(2,6,23,0.6);
border-bottom:1px solid rgba(56,189,248,0.2);
}
/* fsheh logo në mobile */
.logo-container{
display:none;
}

/* butona si app */
.sidebtn{
width:60px;
height:50px;
font-size:12px;
}

/* panel */
.panel{
width:100%;
padding:15px;
margin-bottom:80px; /* 🔥 mos mbulohet nga sidebar */
}

/* viewer TOP si hero */
.viewer{
width:100%;
height:300px;
}

/* title më i vogël */
.viewer-title{
font-size:14px;
}

/* svg responsive */
#svgViewer{
position:absolute;
top:50%;
left:50%;

transform:translate(-50%, -50%);

max-width:80%;
max-height:80%;

object-fit:contain;

z-index:2;

pointer-events:none;
}
}

.viewer-download{
position:absolute;
bottom:20px;
right:20px;

padding:10px 18px;

border-radius:12px;
cursor:pointer;

background:linear-gradient(135deg,#38bdf8,#a855f7);
border:none;

color:white;
font-weight:500;

box-shadow:
0 0 15px rgba(56,189,248,0.6),
0 0 30px rgba(168,85,247,0.4);

transition:0.25s;
z-index:3;
}

.viewer-download:hover{
transform:scale(1.05);
box-shadow:
0 0 25px rgba(56,189,248,0.9),
0 0 50px rgba(168,85,247,0.7);
}
@keyframes neuralMove{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}


@keyframes neuralPulse{
0%,100%{opacity:0.3;}
50%{opacity:0.6;}
}
</style>
</head>

<div class="workspace">

<script>

const API_BASE = "https://pluto3d-production.up.railway.app"

const input = document.getElementById("fileInput")
const preview = document.getElementById("preview")
const status = document.getElementById("status")
const progressBar = document.getElementById("progressBar")

let currentJobId=null


async function upload(){

if(input.files.length==0){

alert("Choose photos")

return

}

currentJobId=crypto.randomUUID()

for(let file of input.files){

let form=new FormData()

form.append("file",file)
form.append("job_id",currentJobId)

await fetch(API_BASE+"/api/upload",{
method:"POST",
body:form
})

}

status.innerHTML="Upload complete"

}

async function generate3D(){

status.innerHTML="Sending to AI..."

const res=await fetch(API_BASE+"/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
  image_url: viewer.src.split("?")[0]
})

})

const data=await res.json()

checkStatus(data.task_id)

}

async function checkStatus(id){

const interval=setInterval(async()=>{

const res=await fetch(API_BASE+"/api/job/"+id)

const data=await res.json()

status.innerHTML="AI Processing "+data.progress+"%"

progressBar.style.width=data.progress+"%"

if(data.status==="SUCCEEDED"){

clearInterval(interval)

status.innerHTML="Model Ready"

const modelUrl = API_BASE + data.model_url

loadModel(modelUrl)

// DOWNLOAD BUTTON
const download = document.getElementById("downloadBtn")
download.href = modelUrl
setupSVGDownload(svgUrl)

}

},4000)

}

function generateFree3D(){

status.innerHTML="Free generation coming soon"

}

/* panels */

function openPanel(name){

document.querySelectorAll(".toolpanel")
.forEach(p=>p.classList.add("hidden"))

document
.getElementById("panel-"+name)
.classList.remove("hidden")

// 🔥 CLEAN VIEWER
document.getElementById("svgViewer").style.display="none"

const btn = document.getElementById("viewerDownload")
btn.classList.add("hidden")

// 🔥 CLEAR 3D SCENE
while(scene.children.length > 0){
scene.remove(scene.children[0])
}
scene.add(light)

status.innerHTML=""
progressBar.style.width="0%"

}

/* three viewer */

const scene = new THREE.Scene()

const viewerContainer = document.getElementById("viewer")

const camera = new THREE.PerspectiveCamera(
75,
viewerContainer.clientWidth / viewerContainer.clientHeight,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
})

renderer.setClearColor(0x000000, 0)

renderer.setSize(
viewerContainer.clientWidth,
viewerContainer.clientHeight
)

document.getElementById("viewer").appendChild(renderer.domElement)
renderer.domElement.style.position = "absolute"
renderer.domElement.style.top = "0"
renderer.domElement.style.left = "0"
renderer.domElement.style.zIndex = "1"

const light=new THREE.DirectionalLight(0xffffff,1)
light.position.set(2,2,2)

scene.add(light)

camera.position.z=3

const controls=new THREE.OrbitControls(camera,renderer.domElement)

function loadModel(url){

const loader=new THREE.GLTFLoader()

loader.load(url,(gltf)=>{
const aiCore = document.querySelector(".ai-core")
if(aiCore) aiCore.style.display = "none"
while(scene.children.length > 0){
scene.remove(scene.children[0])
}

scene.add(light)
scene.add(gltf.scene)

})

}

function animate(){

requestAnimationFrame(animate)

renderer.render(scene,camera)

}

animate()
async function generateSVG(){

const file = document.getElementById("svgInput").files[0]

if(!file){
alert("Upload image first")
return
}

const form = new FormData()
form.append("file",file)

const res = await fetch(API_BASE + "/api/svg",{
method:"POST",
body:form
})

const data = await res.json()

if(data.error){
alert(data.error)
return
}

if(!data.svg_url){
alert("SVG generation failed")
return
}

const svgUrl = API_BASE + data.svg_url

/* SHOW SVG */

const svgViewer = document.getElementById("svgViewer")

svgViewer.src = svgUrl
showViewerDownload(svgUrl, "vector.svg")
// pastro 3D para SVG
while(scene.children.length > 0){
scene.remove(scene.children[0])
}
scene.add(light)
svgViewer.style.display = "block"
document.querySelector(".ai-core").style.display = "none"
// vetëm për SVG → efekt white/neon
svgViewer.style.filter = "invert(1) brightness(2)"



download.style.display = "block"

}



async function convertToSVG(){

const viewer = document.getElementById("svgViewer")

if(!viewer.src){
alert("Generate or upload image first")
return
}

// nëse është blob → upload
if(viewer.src.startsWith("blob:")){

const response = await fetch(viewer.src)
const blob = await response.blob()

const form = new FormData()
form.append("file", blob, "image.png")

const uploadRes = await fetch(API_BASE + "/api/svg",{
method:"POST",
body:form
})

const data = await uploadRes.json()

if(!data.svg_url){
alert("SVG failed")
return
}

const svgUrl = API_BASE + data.svg_url

viewer.src = svgUrl
viewer.style.display="block"
viewer.style.filter = "invert(1) brightness(2)"


return
}

// normal case
const res = await fetch(API_BASE+"/api/svg-from-image",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
image_url: viewer.src.split("?")[0]
})
})

const data = await res.json()

if(!data.svg_url){
alert("SVG conversion failed")
return
}

const svgUrl = API_BASE + data.svg_url

viewer.src = svgUrl
viewer.style.display="block"
viewer.style.filter = "invert(1) brightness(2)"

// 🔥 FIX DOWNLOAD
showViewerDownload(svgUrl, "converted.svg")

}

// ---------------- GLOBAL STL LOADER ----------------

function loadSTL(url){

const loader = new THREE.STLLoader()

loader.load(url,(geometry)=>{

const aiCore = document.querySelector(".ai-core")
if(aiCore) aiCore.style.display = "none"

// pastro skenën
while(scene.children.length > 0){
scene.remove(scene.children[0])
}

// material clean
const material = new THREE.MeshStandardMaterial({
color: 0x00d9ff,
metalness: 0.3,
roughness: 0.4
})

const mesh = new THREE.Mesh(geometry, material)

// center model
geometry.center()

scene.add(light)
scene.add(mesh)
geometry.center()

const box = new THREE.Box3().setFromObject(mesh)
const size = box.getSize(new THREE.Vector3()).length()
const scale = 2 / size

mesh.scale.setScalar(scale)
// 🔥 FIX CAMERA
camera.position.set(0, 0, 3)
controls.update()

})

}
function loadGLB(url){

const loader = new THREE.GLTFLoader()

loader.load(url,(gltf)=>{
console.log("GLB loaded:", url)
document.querySelector(".ai-core").style.display = "none"

// 🔥 CLEAR SCENE
while(scene.children.length > 0){
scene.remove(scene.children[0])
}

scene.add(light)

const model = gltf.scene

// 🔥 CENTER MODEL
const box = new THREE.Box3().setFromObject(model)
const center = box.getCenter(new THREE.Vector3())
model.position.sub(center)

// 🔥 SCALE MODEL
const size = box.getSize(new THREE.Vector3()).length()
const scale = 2 / size
model.scale.setScalar(scale)

// 🔥 ADD MODEL
scene.add(model)

// 🔥 FIX CAMERA
camera.position.set(0, 0, 3)
controls.update()

}, undefined, (error)=>{
console.error("GLB load error:", error)
})

}
/* ===== AI ORB LEVEL 2 CLEAN ===== */

const orb = document.getElementById("aiOrb")
const greeting = document.getElementById("orbGreeting")
if(sound){
  sound.currentTime = 0
  sound.play().catch(()=>{})
}

if(orb){

  function getGreeting(){
    const hour = new Date().getHours()

    if(hour < 12) return "Mirëmëngjes Redi ☕"
    if(hour < 18) return "Ciao Redi 👋"
    return "Gati për të krijuar? 🚀"
  }

  greeting.innerText = getGreeting()

  // hover
  orb.addEventListener("mouseenter", () => {

    orb.classList.add("active")

    orb.classList.add("shake")
    setTimeout(()=> orb.classList.remove("shake"), 400)

    greeting.classList.add("show")

    sound.currentTime = 0
    sound.play().catch(()=>{})

  })

  orb.addEventListener("mouseleave", () => {

    orb.classList.remove("active")
    greeting.classList.remove("show")
    orb.style.transform = "translate(0,0)"

  })

  // magnetic
  orb.addEventListener("mousemove",(e)=>{

    const rect = orb.getBoundingClientRect()

    const x = e.clientX - rect.left
    const y = e.clientY - rect.top

    const moveX = (x - rect.width/2) / 6
    const moveY = (y - rect.height/2) / 6

    orb.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.15)`

  })

  // click → AI panel
  orb.addEventListener("click", () => {
    openPanel("ai")
  })

}

function showViewerDownload(url, filename="file"){

const btn = document.getElementById("viewerDownload")

btn.classList.remove("hidden")

btn.onclick = async () => {

const res = await fetch(url)
const blob = await res.blob()

// 🔥 FORCE TYPE
let type = blob.type

if(filename.endsWith(".svg")){
type = "image/svg+xml"
}

const fixedBlob = new Blob([blob], { type })

const link = document.createElement("a")
link.href = URL.createObjectURL(fixedBlob)
link.download = filename

document.body.appendChild(link)
link.click()
link.remove()

}

}
