<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pluto3D Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:#020617;
color:white;
overflow:hidden;
}

/* layout */

.workspace{

display:grid;
grid-template-columns:90px 420px 1fr;
height:100vh;

}

/* sidebar */

.sidebar{

background:#020617;
border-right:1px solid rgba(56,189,248,0.2);

display:flex;
flex-direction:column;
align-items:center;

padding-top:25px;
gap:20px;

}

.logo{

font-family:Orbitron;
color:#38bdf8;
margin-bottom:20px;

}

.sidebtn{

width:60px;
height:60px;

border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:rgba(14,165,233,0.1);
border:1px solid rgba(56,189,248,0.4);

transition:0.2s;

}

.sidebtn:hover{

background:#0ea5e9;

}

/* panel */

.panel{

padding:30px;
overflow:auto;

background:

linear-gradient(
180deg,
rgba(15,23,42,0.8),
rgba(2,6,23,0.95)
);

border-right:1px solid rgba(56,189,248,0.2);

}

/* viewer */

.viewer{
background:
radial-gradient(circle at center,#020617,#000);
position:relative;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

background:#000;

}

.viewer-title{

position:absolute;
top:20px;
left:20px;

font-family:Orbitron;
color:#38bdf8;

}

#viewer{

width:100%;
height:100%;

box-shadow:
0 0 60px rgba(14,165,233,0.4);

}

/* panels */

.toolpanel{

display:block;

}

.hidden{

display:none;

}

/* title */

.section-title{

font-family:Orbitron;
font-size:22px;
color:#38bdf8;
margin-bottom:20px;

}

/* upload */

.dropzone{

border:2px dashed #0ea5e9;
border-radius:14px;

padding:35px;
text-align:center;

margin-bottom:15px;

}

/* buttons */

button{

width:100%;
padding:12px;

margin-top:10px;

border:none;
border-radius:10px;

cursor:pointer;

background:
linear-gradient(135deg,#0ea5e9,#38bdf8);

color:white;

}

.btn-premium{

background:
linear-gradient(135deg,#f59e0b,#f97316);

}

/* preview */

.preview{

display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;

}

.preview img{

width:80px;
border-radius:8px;
border:2px solid #0ea5e9;

}

/* progress */

.progress{

height:6px;
background:#020617;
border-radius:10px;
overflow:hidden;
margin-top:15px;

}

.progress-bar{

height:100%;
width:0%;

background:
linear-gradient(90deg,#38bdf8,#0ea5e9);

}

/* status */

.status{

margin-top:10px;
font-size:13px;
color:#7dd3fc;

}

</style>
</head>

<body>

<div class="workspace">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">P3D</div>

<div class="sidebtn" onclick="openPanel('3d')">3D</div>

<div class="sidebtn" onclick="openPanel('svg')">SVG</div>

<div class="sidebtn" onclick="openPanel('ai')">AI</div>

<div class="sidebtn" onclick="openPanel('toy')">Toy</div>

</div>

<!-- PANEL -->

<div class="panel">

<!-- 3D -->

<div id="panel-3d" class="toolpanel">

<div class="section-title">3D Generator</div>

<div class="dropzone" id="drop3d">

<p id="dropText3d">Drag photo here or click to upload</p>

<img id="dropPreview3d" 
style="width:100%;height:200px;object-fit:contain;display:none;border-radius:10px;">

<input type="file" id="fileInput" multiple style="display:none">

</div>

<button onclick="generateFree3D()">
Generate Free
</button>

<button class="btn-premium" onclick="generate3D()">
Generate Premium
</button>
<button id="downloadAI" class="btn">
Download Image
</button>
<div class="preview" id="preview"></div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="status" id="status"></div>
<a id="downloadBtn" class="download-btn" style="display:none;" download>
Download 3D Model
</a>
</div>

<div id="panel-svg" class="toolpanel hidden">

<div class="section-title">SVG Generator</div>

<div class="dropzone" id="dropSVG">

<p id="dropTextSVG">Drag photo here or click to upload</p>

<img id="dropPreviewSVG"
style="width:100%;height:200px;object-fit:contain;display:none;border-radius:10px;">

<input type="file" id="svgInput" style="display:none">

</div>

<br><br>

<label>Mode</label>
<select id="svgMode">
<option value="outline">Outline</option>
<option value="engrave">Engrave</option>
<option value="stencil">Stencil</option>
</select>

<br><br>

<label>Shadow</label>
<input type="range" id="shadowRange" min="0" max="100" value="20">

<br><br>

<label>Contrast</label>
<input type="range" id="contrastRange" min="0" max="100" value="50">

<br><br>

<button onclick="generateSVG()">Generate SVG</button>

<br><br>

<div id="svgPreview"></div>

<a id="downloadSVG" style="display:none;" download>
<button style="margin-top:10px;">Download SVG </button>
</a>

</div>


<!-- AI -->

<div id="panel-ai" class="toolpanel hidden">

<div class="section-title">AI Photo Studio</div>

<!-- DRAG & DROP -->

<div class="dropzone" id="aiDrop">

Drag photo here or click

<input type="file" id="aiInput" style="display:none">

</div>

<img id="aiPreview" 
style="width:120px;margin-top:10px;border-radius:10px;display:none">

<br><br>

<!-- PROMPT -->

<label>Prompt</label>

<textarea id="aiPrompt"
placeholder="modify image or create new image"
style="width:100%;height:70px;border-radius:10px;padding:10px;"></textarea>

<br><br>

<!-- STYLE -->

<label>Style</label>

<select id="aiStyle">

<option value="realistic">Realistic</option>
<option value="toy">3D Toy</option>
<option value="cartoon">Cartoon</option>
<option value="metal">Metal</option>
<option value="cyber">Cyberpunk</option>

</select>

<br><br>

<button onclick="generateAIPhoto()">Generate AI Image</button>
<button onclick="downloadAI()">Download Image</button>
<br><br>

<button onclick="convertToSVG()">Convert to SVG</button>

<button onclick="convertTo3D()">Convert to 3D</button>

<button class="btn-premium" onclick="convertTo3DPro()">3D PRO</button>

</div>

<!-- TOY -->

<div id="panel-toy" class="toolpanel hidden">

<div class="section-title">Toy Studio</div>

<button onclick="toyMode()">Toy Mode</button>

<button onclick="selfieToy()">Selfie Toy</button>

<br>

<button onclick="plasticToy()">Plastic</button>

<button onclick="goldToy()">Gold</button>

<button onclick="chromeToy()">Chrome</button>

<button onclick="cartoonToy()">Cartoon</button>

</div>

</div>


<!-- VIEWER -->

<div class="viewer" id="viewer">

<div class="viewer-title">AI Viewer</div>
<!-- background selector -->
<div style="position:absolute;top:20px;right:20px;z-index:10">

<select id="bgSelector">

<option value="#000">Dark</option>
<option value="#020617">Space</option>
<option value="#0f172a">Blueprint</option>
<option value="#ffffff">White</option>

</select>

<img id="svgViewer"
style="
width:70%;
height:auto;
max-width:700px;
object-fit:contain;
display:none;
filter:none;
">
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

const API_BASE = "https://pluto3d-production.up.railway.app"

const input = document.getElementById("fileInput")
const preview = document.getElementById("preview")
const status = document.getElementById("status")
const progressBar = document.getElementById("progressBar")

let currentJobId=null

input.addEventListener("change",()=>{

preview.innerHTML=""

for(let file of input.files){

const img=document.createElement("img")
img.src=URL.createObjectURL(file)
preview.appendChild(img)

}

})

async function upload(){

if(input.files.length==0){

alert("Choose photos")

return

}

currentJobId=crypto.randomUUID()

for(let file of input.files){

let form=new FormData()

form.append("file",file)
form.append("job_id",currentJobId)

await fetch(API_BASE+"/api/upload",{
method:"POST",
body:form
})

}

status.innerHTML="Upload complete"

}

async function generate3D(){

status.innerHTML="Sending to AI..."

const res=await fetch(API_BASE+"/api/generate",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
job_id:currentJobId
})

})

const data=await res.json()

checkStatus(data.task_id)

}

async function checkStatus(id){

const interval=setInterval(async()=>{

const res=await fetch(API_BASE+"/api/job/"+id)

const data=await res.json()

status.innerHTML="AI Processing "+data.progress+"%"

progressBar.style.width=data.progress+"%"

if(data.status==="SUCCEEDED"){

clearInterval(interval)

status.innerHTML="Model Ready"

const modelUrl = API_BASE + data.model_url

loadModel(modelUrl)

// DOWNLOAD BUTTON
const download = document.getElementById("downloadBtn")
download.href = modelUrl
download.style.display = "block"

}

},4000)

}

function generateFree3D(){

status.innerHTML="Free generation coming soon"

}

/* panels */

function openPanel(name){

document.querySelectorAll(".toolpanel")
.forEach(p=>p.classList.add("hidden"))

document
.getElementById("panel-"+name)
.classList.remove("hidden")
document.getElementById("svgViewer").style.display="none"
status.innerHTML=""
progressBar.style.width="0%"
}

/* three viewer */

const scene = new THREE.Scene()

const viewerContainer = document.getElementById("viewer")

const camera = new THREE.PerspectiveCamera(
75,
viewerContainer.clientWidth / viewerContainer.clientHeight,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({antialias:true})

renderer.setSize(
viewerContainer.clientWidth,
viewerContainer.clientHeight
)

document.getElementById("viewer").appendChild(renderer.domElement)

const light=new THREE.DirectionalLight(0xffffff,1)
light.position.set(2,2,2)

scene.add(light)

camera.position.z=3

const controls=new THREE.OrbitControls(camera,renderer.domElement)

function loadModel(url){

const loader=new THREE.GLTFLoader()

loader.load(url,(gltf)=>{

while(scene.children.length > 0){
scene.remove(scene.children[0])
}

scene.add(light)
scene.add(gltf.scene)

})

}

function animate(){

requestAnimationFrame(animate)

renderer.render(scene,camera)

}

animate()
async function generateSVG(){

const file = document.getElementById("svgInput").files[0]

if(!file){
alert("Upload image first")
return
}

const form = new FormData()
form.append("file",file)

const res = await fetch(API_BASE + "/api/svg",{
method:"POST",
body:form
})

const data = await res.json()

if(data.error){
alert(data.error)
return
}

if(!data.svg_url){
alert("SVG generation failed")
return
}

const svgUrl = API_BASE + data.svg_url

/* SHOW SVG */

const svgViewer = document.getElementById("svgViewer")

svgViewer.src = svgUrl
svgViewer.style.display = "block"

// vetëm për SVG → efekt white/neon
svgViewer.style.filter = "invert(1) brightness(2)"

/* DOWNLOAD */

const download = document.getElementById("downloadSVG")

download.onclick = async () => {

  const res = await fetch(svgUrl)
  const blob = await res.blob()

  const url = window.URL.createObjectURL(blob)

  const a = document.createElement("a")
  a.href = url
  a.download = "vector.svg"

  document.body.appendChild(a)
  a.click()
  a.remove()
}

download.style.display = "block"

}



async function convertToSVG(){

const viewer = document.getElementById("svgViewer")

if(!viewer.src){
alert("Generate or upload image first")
return
}

const res = await fetch(API_BASE+"/api/svg-from-image",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
image_url: viewer.src
})

})

const data = await res.json()

if(!data.svg_url){
alert("SVG conversion failed")
return
}

const svgUrl = API_BASE + data.svg_url

// 🔥 SHOW SVG (SI generateSVG)
viewer.src = svgUrl
viewer.style.display = "block"

// vetëm për SVG → efekt white
viewer.style.filter = "invert(1) brightness(2)"

// 🔥 DOWNLOAD FIX
const download = document.getElementById("downloadSVG")

download.onclick = async () => {

  const res = await fetch(svgUrl)
  const blob = await res.blob()

  const url = window.URL.createObjectURL(blob)

  const a = document.createElement("a")
  a.href = url
  a.download = "vector.svg"

  document.body.appendChild(a)
  a.click()
  a.remove()
}

download.style.display = "block"

}
/* ---------------- AI PHOTO ---------------- */

async function generateAIPhoto(){

const prompt = document.getElementById("aiPrompt").value.trim()
const style = document.getElementById("aiStyle").value
const fileInput = document.getElementById("aiInput")

if(!prompt && fileInput.files.length === 0){

alert("Write prompt or upload image")
return

}

const form = new FormData()

form.append("prompt",prompt)
form.append("style",style)

if(fileInput.files.length > 0){
form.append("image",fileInput.files[0])
}

try{

const res = await fetch(API_BASE+"/api/ai-photo",{
method:"POST",
body:form
})

if(!res.ok){

const txt = await res.text()
console.log(txt)

alert("AI request failed")
return

}

const data = await res.json()

if(data.error){

alert(data.error)
return

}

if(!data.image_url){

alert("AI returned empty image")
return

}

const viewer = document.getElementById("svgViewer")

viewer.src = data.image_url
viewer.style.display="block"
viewer.style.filter = "none"
}catch(err){

console.log(err)
alert("AI request crashed")

}

}
const aiDrop = document.getElementById("aiDrop")
const aiInput = document.getElementById("aiInput")

aiDrop.addEventListener("click",()=>{
aiInput.click()
})

aiInput.addEventListener("change",()=>{

const file = aiInput.files[0]

if(!file) return

const url = URL.createObjectURL(file)

const preview = document.getElementById("aiPreview")

preview.src = url
preview.style.display="block"

})
async function convertTo3D(){

const viewer = document.getElementById("svgViewer")

if(!viewer.src){

alert("Generate image first")
return

}

const res = await fetch(API_BASE+"/api/image-to-3d",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
image_url: viewer.src
})

})

const data = await res.json()

loadModel(API_BASE + data.model_url)

}
async function convertTo3DPro(){

const viewer = document.getElementById("svgViewer")

if(!viewer.src){

alert("Generate image first")
return

}

const res = await fetch(API_BASE+"/api/image-to-3d-pro",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
image_url: viewer.src
})

})

const data = await res.json()

loadModel(API_BASE + data.model_url)

}
document.getElementById("bgSelector")
.addEventListener("change",function(){

document.querySelector(".viewer").style.background=this.value

})
async function downloadAI(){

const img = document.getElementById("svgViewer")

if(!img.src){
alert("No image")
return
}

const response = await fetch(img.src)

const blob = await response.blob()

const url = window.URL.createObjectURL(blob)

const a = document.createElement("a")

a.href = url
a.download = "ai_image.png"

document.body.appendChild(a)

a.click()

a.remove()

}
/* ---------------- 3D DROPZONE ---------------- */

const drop3d = document.getElementById("drop3d")

drop3d.addEventListener("click",()=>{
input.click()
})

drop3d.addEventListener("dragover",(e)=>{
e.preventDefault()
drop3d.style.borderColor="#38bdf8"
})

drop3d.addEventListener("dragleave",()=>{
drop3d.style.borderColor="#0ea5e9"
})

drop3d.addEventListener("drop",(e)=>{
e.preventDefault()

input.files = e.dataTransfer.files
handleFiles(input.files)
})

input.addEventListener("change",()=>{
handleFiles(input.files)
})

function handleFiles(files){

preview.innerHTML=""

for(let file of files){

const img=document.createElement("img")
img.src=URL.createObjectURL(file)
preview.appendChild(img)

}

autoUpload(files)
}

async function autoUpload(files){

currentJobId = crypto.randomUUID()

for(let file of files){

let form=new FormData()
form.append("file",file)
form.append("job_id",currentJobId)

await fetch(API_BASE+"/api/upload",{
method:"POST",
body:form
})

}

status.innerHTML="Uploaded & ready 🚀"

}
/* ---------------- SVG DROPZONE ---------------- */

const dropSVG = document.getElementById("dropSVG")
const svgInput = document.getElementById("svgInput")

dropSVG.addEventListener("click",()=>{
svgInput.click()
})

dropSVG.addEventListener("dragover",(e)=>{
e.preventDefault()
dropSVG.style.borderColor="#38bdf8"
})

dropSVG.addEventListener("dragleave",()=>{
dropSVG.style.borderColor="#0ea5e9"
})

dropSVG.addEventListener("drop",(e)=>{
e.preventDefault()

svgInput.files = e.dataTransfer.files
handleSVG(svgInput.files[0])
})

svgInput.addEventListener("change",()=>{
handleSVG(svgInput.files[0])
})

function handleSVG(file){

if(!file) return

const url = URL.createObjectURL(file)

// preview brenda dropzone
const img = document.getElementById("dropPreviewSVG")
const text = document.getElementById("dropTextSVG")

img.src = url
img.style.display = "block"
text.style.display = "none"

}
</script>

</body>
</html>
